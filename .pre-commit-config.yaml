ci:
  skip: [pylint]

repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: "v0.16.8"
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
        types_or: [python, markdown]
        args: ["--preview"]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.29.4"
    hooks:
      - id: pyproject-fmt
  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: system
        args: ["-sn", "-rn", "--enable-all-extensions"]
        types: [python]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: ["--strict"]
        exclude: "tests/demo_pylint/platform_checker\\.py"
        additional_dependencies: [pytest>=7.0, pandas-stubs]
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        args: ["src"]
        pass_filenames: false
        additional_dependencies: [pytest>=7.0, pandas-stubs]
  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: ty check src
        language: python
        pass_filenames: false
        types: [python]
        additional_dependencies: [ty, pytest>=7.0, pandas-stubs]
      - id: import-linter
        name: import-linter
        # Contracts live in .importlinter. Declared local with language: python
        # rather than pulling the upstream repo, whose hook is language: system
        # and would need the dev extra installed. grimp reads the source
        # statically, so no project dependency is needed; PYTHONPATH=src lets it
        # find the package in the src layout. Version is pinned here, not by a
        # rev, so `pre-commit autoupdate` won't move it: bump it by hand
        # alongside the dev extra.
        entry: env PYTHONPATH=src lint-imports
        language: python
        additional_dependencies: ["import-linter==2.15"]
        pass_filenames: false
        require_serial: true
        types: [python]
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        args: [--prose-wrap=always, --print-width=88]
